[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "label_bro"
version = "0.1.0"
description = "Flask web application for Brother QL-800 Label Printers with React frontend"
readme = "README.md"
authors = [{ name="Label Bro Team", email="team@labelbro.com" }]
requires-python = ">=3.11"
dependencies = [
    "brother_ql>=0.9.4",
    "Flask>=3.1.0",
    "Pillow>=10.0.0",
    "pycairo>=1.20.0",
    "pyusb>=1.2.0",
    "zeroconf>=0.140.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["label_bro*"]

[tool.setuptools.package-data]
label_bro = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["label_bro/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# [LAW:one-source-of-truth] the rule set lives here, not in whichever defaults the installed ruff ships.
# BLE, E722, S110 and S112 are the swallowed-exception rules ([LAW:no-silent-failure]).
select = ["E4", "E7", "E9", "E722", "W", "F", "I", "UP", "B", "BLE", "S110", "S112", "SIM", "PIE", "RUF", "EXE"]

[tool.pyright]
include = ["label_bro"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
