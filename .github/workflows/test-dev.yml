name: TypeScript Dev Environment Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger

jobs:
  test-dev-environment:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        python-version: [3.11, 3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Just command runner
      run: |
        # Install just for Ubuntu
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcairo2-dev \
          libgirepository1.0-dev \
          pkg-config \
          python3-dev \
          libusb-1.0-0-dev

    - name: Install Node.js dependencies
      run: npm ci

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run TypeScript type checking
      run: npm run typecheck

    - name: Run TypeScript build
      run: npm run build

    - name: Run dev environment test
      run: |
        # Run the automated dev test with shorter timeout for CI
        npm run test:dev -- --ci --timeout=30
      timeout-minutes: 2

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-dev-report-node${{ matrix.node-version }}-python${{ matrix.python-version }}
        path: test-dev-report.json
        retention-days: 7

    - name: Comment test results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './test-dev-report.json';
          
          if (fs.existsSync(path)) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const success = report.summary.tsErrors === 0 && report.summary.runtimeErrors === 0;
            const icon = success ? '✅' : '❌';
            
            const comment = `
            ## ${icon} Dev Environment Test Results
            
            **Node.js**: ${{ matrix.node-version }} | **Python**: ${{ matrix.python-version }}
            
            - **Duration**: ${(report.duration / 1000).toFixed(1)}s
            - **TypeScript Errors**: ${report.summary.tsErrors}
            - **Runtime Errors**: ${report.summary.runtimeErrors}  
            - **Warnings**: ${report.summary.warnings}
            - **Overall**: ${success ? 'PASS' : 'FAIL'}
            
            ${report.summary.tsErrors > 0 ? '### TypeScript Errors\n' + report.details.typeScriptErrors.map(e => `- ${e.line}`).join('\n') + '\n' : ''}
            ${report.summary.runtimeErrors > 0 ? '### Runtime Errors\n' + report.details.runtimeErrors.map(e => `- ${e.line}`).join('\n') + '\n' : ''}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  test-manual-verification:
    runs-on: ubuntu-latest
    needs: test-dev-environment
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Manual test instructions
      run: |
        echo "## Manual Testing Required"
        echo ""
        echo "Please verify the following manually:"
        echo "1. Radio buttons work correctly (Manual IP vs Auto Discovery)"
        echo "2. Local storage persists settings between page reloads"
        echo "3. Auto-connect works on page load"
        echo "4. Manual IP connections count as 'selected printer'"
        echo "5. No 'No printer selected' errors with valid connections"
        echo ""
        echo "To test locally, run: npm run test:dev"