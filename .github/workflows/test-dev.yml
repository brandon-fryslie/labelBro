name: Continuous Integration

on:
  push:
    branches: [ main, master, develop, bmf_typescript ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger

jobs:
  typecheck-and-build:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Run TypeScript type checking
      run: npm run typecheck

    - name: Run TypeScript build
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-node${{ matrix.node-version }}
        path: |
          label_bro/static/js/bundle.js
          label_bro/static/js/bundle.js.map
          label_bro/static/js/bundle.css
          label_bro/static/js/bundle.css.map
        retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-node${{ matrix.node-version }}
        path: .

    - name: Run Jest tests
      run: npm test -- --ci --coverage --watchAll=false
      env:
        NODE_ENV: test

    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      if: matrix.node-version == '20.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-node${{ matrix.node-version }}
        path: |
          junit.xml
          test-results.json
        retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    strategy:
      matrix:
        node-version: [20.x]
        python-version: [3.11, 3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Just command runner
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcairo2-dev \
          libgirepository1.0-dev \
          pkg-config \
          python3-dev \
          libusb-1.0-0-dev

    - name: Install Node.js dependencies
      run: npm ci

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-node${{ matrix.node-version }}
        path: .

    - name: Run integration tests
      run: npm run test:integration -- --ci --watchAll=false
      env:
        NODE_ENV: test

    - name: Run cross-system logging tests
      run: npm run test:cross-system -- --ci --watchAll=false
      env:
        NODE_ENV: test

    - name: Run dev environment test
      run: |
        # Run the automated dev test with shorter timeout for CI
        timeout 60s npm run test:dev -- --ci --timeout=30 || true
      timeout-minutes: 2

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-node${{ matrix.node-version }}-python${{ matrix.python-version }}
        path: |
          test-dev-report.json
          integration-test-results.json
        retention-days: 7

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-node20.x
        path: .

    - name: Run performance tests
      run: |
        # Check bundle size
        echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "| File | Size |" >> $GITHUB_STEP_SUMMARY  
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "label_bro/static/js/bundle.js" ]; then
          JS_SIZE=$(stat -c%s "label_bro/static/js/bundle.js" | numfmt --to=iec)
          echo "| bundle.js | $JS_SIZE |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "label_bro/static/js/bundle.css" ]; then
          CSS_SIZE=$(stat -c%s "label_bro/static/js/bundle.css" | numfmt --to=iec)
          echo "| bundle.css | $CSS_SIZE |" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Performance validation tests
        npm run test:validation -- --ci --watchAll=false
      env:
        NODE_ENV: test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run security audit
      run: |
        echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
        echo "### NPM Audit" >> $GITHUB_STEP_SUMMARY
        npm audit --audit-level=low || echo "⚠️ Security vulnerabilities found" >> $GITHUB_STEP_SUMMARY

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [typecheck-and-build, unit-tests, integration-tests]
    if: github.event_name == 'pull_request' && always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Comment test results on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔍 CI Test Results\n\n';
          
          // Check for test dev report
          const testDevPath = './integration-test-results-node20.x-python3.12/test-dev-report.json';
          if (fs.existsSync(testDevPath)) {
            const report = JSON.parse(fs.readFileSync(testDevPath, 'utf8'));
            const success = report.summary.tsErrors === 0 && report.summary.runtimeErrors === 0;
            const icon = success ? '✅' : '❌';
            
            comment += `### ${icon} Integration Tests\n`;
            comment += `- **Duration**: ${(report.duration / 1000).toFixed(1)}s\n`;
            comment += `- **TypeScript Errors**: ${report.summary.tsErrors}\n`;
            comment += `- **Runtime Errors**: ${report.summary.runtimeErrors}\n`;
            comment += `- **Warnings**: ${report.summary.warnings}\n`;
            comment += `- **Overall**: ${success ? 'PASS' : 'FAIL'}\n\n`;
            
            if (report.summary.tsErrors > 0) {
              comment += '#### TypeScript Errors\n';
              report.details.typeScriptErrors.forEach(e => {
                comment += `- ${e.line}\n`;
              });
              comment += '\n';
            }
          }
          
          // Check build status
          const buildSuccess = '${{ needs.typecheck-and-build.result }}' === 'success';
          const unitTestSuccess = '${{ needs.unit-tests.result }}' === 'success';
          const integrationSuccess = '${{ needs.integration-tests.result }}' === 'success';
          
          comment += '### 📋 Test Summary\n';
          comment += `- **Build & TypeScript**: ${buildSuccess ? '✅ PASS' : '❌ FAIL'}\n`;
          comment += `- **Unit Tests**: ${unitTestSuccess ? '✅ PASS' : '❌ FAIL'}\n`;
          comment += `- **Integration Tests**: ${integrationSuccess ? '✅ PASS' : '❌ FAIL'}\n\n`;
          
          if (!buildSuccess || !unitTestSuccess || !integrationSuccess) {
            comment += '### ⚠️ Manual Verification Required\n';
            comment += 'Some automated tests failed. Please verify manually:\n';
            comment += '1. Radio buttons work correctly (Manual IP vs Auto Discovery)\n';
            comment += '2. Local storage persists settings between page reloads\n';
            comment += '3. Auto-connect works on page load\n';
            comment += '4. Manual IP connections count as \'selected printer\'\n';
            comment += '5. No \'No printer selected\' errors with valid connections\n\n';
            comment += 'To test locally: `npm run test:dev`\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });